<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vice Cover Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Vice Cover Studio</h1>
      <span class="tag">GTA-style cover art</span>
    </div>
    <span class="hint">Offline • no network • OFL fonts</span>
  </header>

  <div class="shell">
    <aside class="sidebar" role="navigation" aria-label="Editor controls"></aside>

    <section class="stage" aria-label="Live preview">
      <div class="preview-frame">
        <canvas id="preview"></canvas>
        <span class="stage-badge"><b>LIVE PREVIEW</b></span>
        <span class="stage-note">Drag on a panel to pan • slider to zoom</span>
      </div>
    </section>
  </div>

  <div id="shotwrap" aria-hidden="true">
    <canvas id="cover"></canvas>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
